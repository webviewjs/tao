[package]
name = "macos-pump-wry"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "macos-pump-wry"

[workspace]

[dependencies]
image = "0.25"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSGeometry"] }
tao = { path = "../..", features = ["rwh_06"] }
wry = "0.55.1"

[patch.crates-io]
tao = { path = "../.." }
